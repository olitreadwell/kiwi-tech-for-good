# Config touch to trigger a fresh Dependabot run after the auto-merge rework.
# Third touch: force Dependabot to rebase open PRs so their auto-merge checks re-run green.
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Pacific/Auckland
  open-pull-requests-limit: 5
  labels:
  - dependencies
  groups:
    production-patch:
      dependency-type: production
      update-types:
      - patch
    production-minor:
      dependency-type: production
      update-types:
      - minor
    development-patch:
      dependency-type: development
      update-types:
      - patch
    development-minor:
      dependency-type: development
      update-types:
      - minor
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Pacific/Auckland
  open-pull-requests-limit: 5
  labels:
  - dependencies
  groups:
    all-dependencies:
      patterns:
      - "*"
      update-types:
      - patch
      - minor
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Pacific/Auckland
  open-pull-requests-limit: 5
  labels:
  - dependencies
  groups:
    all-dependencies:
      patterns:
      - "*"
      update-types:
      - patch
      - minor
